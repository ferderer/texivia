name: Release

# Changesets: on push to main, either opens/updates the "Version Packages" PR
# (when .changeset/*.md files exist) or publishes every package whose version
# is not on npm yet. Publishing uses npm trusted publishing (OIDC, no token);
# each package needs a trusted publisher entry on npmjs.com for this workflow.

on:
  push:
    branches: [ main ]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build -w packages
      - uses: changesets/action@v2
        with:
          publish-script: npx changeset publish
          create-github-releases: true
