<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texivia Ecosystem Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f; color: #e8e8e8;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem;
    }
    #app { width: 100%; max-width: 640px; }

    .page { padding: 2rem 0; }
    h1    { font-size: 2rem; margin-bottom: 1rem; }
    p     { color: #aaa; margin-bottom: 1rem; line-height: 1.6; }
    a     { color: #7eb8ff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .demo-nav { display: flex; gap: 1.5rem; margin-top: 1.5rem; }
    .demo-nav a { font-size: 1.1rem; }

    .counter-value { font-size: 5rem; font-weight: 700; color: #fff; text-align: center; margin: 1.5rem 0; }
    .counter-controls { display: flex; gap: 1rem; justify-content: center; }
    .counter-controls button {
      font-size: 1.5rem; width: 3rem; height: 3rem;
      border: 1px solid #444; border-radius: 8px;
      background: #1e1e1e; color: #e8e8e8; cursor: pointer;
      transition: background 0.15s;
    }
    .counter-controls button:hover { background: #2e2e2e; }

    dl { display: grid; grid-template-columns: auto 1fr; gap: 0.5rem 1.5rem; margin-bottom: 1.5rem; }
    dt { font-weight: 600; color: #ccc; }
    dd { color: #aaa; }

    .back { margin-top: 2rem; }
    .error { color: #ff6b6b; }

    label {
      display: flex; flex-direction: column; gap: 0.4rem;
      margin-bottom: 1rem; font-size: 0.9rem; color: #aaa;
    }
    input[type="text"], input[type="email"], textarea, select {
      background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
      color: #e8e8e8; font-size: 1rem; padding: 0.5rem 0.75rem;
      outline: none; transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: #7eb8ff; }
    textarea { resize: vertical; font-family: inherit; }

    fieldset { border: 1px solid #333; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
    legend { color: #aaa; font-size: 0.9rem; padding: 0 0.4rem; }
    fieldset label, .checkbox-label {
      flex-direction: row; align-items: center;
      gap: 0.5rem; color: #e8e8e8; margin-bottom: 0.4rem;
    }

    .preview { font-size: 0.85rem; color: #666; font-family: monospace; margin: 1rem 0; }

    button {
      background: #7eb8ff; color: #000; border: none; border-radius: 6px;
      padding: 0.6rem 1.4rem; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: #a8d0ff; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
